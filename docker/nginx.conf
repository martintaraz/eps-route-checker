server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the routing engine so the browser reaches it same-origin.
    # The frontend calls `${location.origin}/valhalla/...` — Valhalla itself sends
    # no CORS headers, so this proxy is what makes routing work in the browser.
    location /valhalla/ {
        proxy_pass http://valhalla:8002/;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
