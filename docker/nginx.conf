server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Share backend, reached same-origin so the browser needs no CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        client_max_body_size 4m;
    }

    # Serve real files (index.html, the bundled .gpx) directly; fall back to index.html
    # for /<uuid> share links so the SPA can read the id from the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
